<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>My Notes</title>
    
    <!-- PWA & Stealth Mode Settings -->
    <meta name="description" content="HeySis — Privacy-first open-source stealth PWA & safe AI guidance for adolescent girls. Zero tracking, 100% offline-ready." />
    <meta name="theme-color" content="#8965DF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Notes" />

    <!-- Open Graph / Social Media Preview (Product Hunt, X, LinkedIn, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hey-sis.vercel.app/" />
    <meta property="og:site_name" content="HeySis" />
    <meta property="og:title" content="HeySis — Privacy-First Puberty Guidance & Safe AI for Teen Girls" />
    <meta property="og:description" content="Open-source (MIT & CC-BY 4.0) stealth PWA with Panic Button camouflage, 268 offline OpenAI Nova voice clips, safe AI informed by WHO & UNICEF public guidelines, and zero telemetry." />
    <meta property="og:image" content="https://hey-sis.vercel.app/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="718" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hey-sis.vercel.app/" />
    <meta name="twitter:title" content="HeySis — Privacy-First Stealth PWA & Safe AI for Teen Girls" />
    <meta name="twitter:description" content="Open-source puberty guidance with instant Panic Button calculator camouflage, offline OpenAI Nova voice, and zero tracking." />
    <meta name="twitter:image" content="https://hey-sis.vercel.app/og-preview.png" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts Nunito for friendly warm typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 text-stone-800 antialiased font-sans select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for offline capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
