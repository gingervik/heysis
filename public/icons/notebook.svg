<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background badge rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#notebookGrad)"/>
  <!-- Notebook Cover -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Main notebook body -->
    <rect x="20" y="20" width="260" height="320" rx="20" fill="#FFFFFF"/>
    <!-- Notebook bookmark ribbon -->
    <path d="M70 20 V110 L95 90 L120 110 V20 Z" fill="#F59E0B" />
    <!-- Notebook lines -->
    <rect x="70" y="150" width="160" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="70" y="185" width="160" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="70" y="220" width="160" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="70" y="255" width="100" height="12" rx="6" fill="#E2E8F0"/>
    <!-- Spiral binding or spine on the left -->
    <rect x="20" y="20" width="30" height="320" rx="10" fill="#93C5FD"/>
    <circle cx="35" cy="70" r="7" fill="#1D4ED8"/>
    <circle cx="35" cy="120" r="7" fill="#1D4ED8"/>
    <circle cx="35" cy="170" r="7" fill="#1D4ED8"/>
    <circle cx="35" cy="220" r="7" fill="#1D4ED8"/>
    <circle cx="35" cy="270" r="7" fill="#1D4ED8"/>
    <circle cx="35" cy="310" r="7" fill="#1D4ED8"/>
  </g>
</svg>
